<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            font-size: 1.3em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-type {
            font-size: 0.9em;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .error {
            color: #f5576c;
            font-size: 1.1em;
            margin-top: 15px;
        }

        .info {
            font-size: 0.9em;
            color: #666;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: white;
            text-decoration: none;
            font-size: 1em;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            transition: background 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .joke-text {
                font-size: 1.1em;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        
        <div class="joke-box">
            <div id="jokeContent">
                <div class="loader" id="loader"></div>
                <div id="jokeDisplay" style="display: none;">
                    <div class="joke-type" id="jokeType"></div>
                    <div class="joke-text" id="jokeText"></div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="getJoke()">Get New Joke</button>
            <button class="secondary-btn" onclick="copyJoke()">Copy Joke</button>
        </div>

        <div class="error" id="error"></div>

        <div class="info">
            <p>Powered by <strong>Official Joke API</strong></p>
            <p>Click the button to get a random joke!</p>
        </div>

        <a href="index.html" class="back-link">← Back to Portfolio</a>
    </div>

    <script>
        let currentJoke = null;

        // Fetch joke on page load
        window.addEventListener('load', getJoke);

        async function getJoke() {
            const loader = document.getElementById('loader');
            const jokeDisplay = document.getElementById('jokeDisplay');
            const error = document.getElementById('error');
            
            loader.style.display = 'block';
            jokeDisplay.style.display = 'none';
            error.textContent = '';

            try {
                // Using Official Joke API (free, no authentication needed)
                const response = await fetch('https://official-joke-api.appspot.com/random_joke');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();
                currentJoke = data;

                // Display the joke
                document.getElementById('jokeType').textContent = data.type;
                document.getElementById('jokeText').textContent = data.setup + ' ' + data.punchline;

                loader.style.display = 'none';
                jokeDisplay.style.display = 'block';

            } catch (err) {
                loader.style.display = 'none';
                error.textContent = '❌ Oops! Could not fetch a joke. Please try again.';
                console.error('Error:', err);
            }
        }

        function copyJoke() {
            if (!currentJoke) {
                alert('Please get a joke first!');
                return;
            }

            const jokeText = currentJoke.setup + ' ' + currentJoke.punchline;
            navigator.clipboard.writeText(jokeText).then(() => {
                alert('✅ Joke copied to clipboard!');
            }).catch(() => {
                alert('Failed to copy to clipboard');
            });
        }
    </script>
</body>
</html>
